{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>

    <link rel="stylesheet" href="{% static 'myapp/css/account.css' %}" />
    <title>TSP Graduation Work</title>
  </head>

  <body>

      <div class="user-info">
        <span class="username">{{user.username}}</span>

    <div class="container">
      <div class="column">
        <h2>Текст</h2>
        <p>Привет</p>
      </div>
    </div>
  </body>
</html>

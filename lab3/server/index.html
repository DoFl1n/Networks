<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RSS Агрегатор — Выбор ленты</title>
</head>
<body>
    <h1>📰 Выберите ленту новостей</h1>
    <ul>
        <!-- В href передаем параметр topic, совпадающий с url ленты на сервере -->
        <li>
            <a href="/feed?topic=https://news.mail.ru/rss/90/">Первая лента</a>
        </li>
        <li>
            <a href="/feed?topic=https://lenta.ru/rss">Вторая лента</a>
        </li>
        <li>
            <a href="/dashboard"><strong>Сводный дашборд (Mail.ru + Lenta.ru)</strong></a>
        </li>
    </ul>
</body>
</html>
